name: Build APK

on:
  workflow_dispatch:
    inputs:
      note:
        description: 'Build note'
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Android SDK (pre-installed on runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la $ANDROID_HOME 2>/dev/null || true
          ls -la $ANDROID_HOME/platforms 2>/dev/null || true
          ls -la $ANDROID_HOME/build-tools 2>/dev/null || true

      - name: Install required Android SDK packages
        run: |
          SDK_ROOT=$ANDROID_HOME
          if [ -z "$SDK_ROOT" ]; then SDK_ROOT=/usr/local/lib/android/sdk; fi
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$SDK_ROOT/platform-tools" >> $GITHUB_PATH
          yes | $SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          $SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --list_installed 2>/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew 2>/dev/null || true

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace --warning-mode all

      - name: Locate and rename APK
        run: |
          mkdir -p output
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "APK tidak ditemukan!"
            find . -name "*.apk" -type f || true
            ls -la app/build/outputs/apk/debug/ || true
            exit 1
          fi
          cp "$APK_PATH" output/app.apk
          ls -la output/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: built-apk
          path: output/app.apk
          retention-days: 1
          if-no-files-found: error
